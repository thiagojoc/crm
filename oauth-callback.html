<!DOCTYPE html>
  <html lang="pt-BR">
  <head>
  <meta charset="UTF-8">
  <title>Autorizacao Google - WA CRM Bridge</title>
  <style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 60px auto; padding: 0 16px; line-height: 1.6; color: #222; text-align: center; }
textarea { width: 100%; height: 60px; font-size: 16px; margin-top: 16px; padding: 8px; }
</style>
  </head>
  <body>
  <h2>Autorizacao concluida</h2>
  <p>Copie o codigo abaixo e cole onde o script de autorizacao estiver pedindo:</p>
  <textarea id="code" readonly onclick="this.select()"></textarea>
  <p id="status"></p>
  <script>
  var params = new URLSearchParams(window.location.search);
var code = params.get('code');
var error = params.get('error');
  if (code) {
  document.getElementById('code').value = code;
  document.getElementById('status').textContent = 'Codigo capturado com sucesso.';
  } else if (error) {
  document.getElementById('code').value = '';
      document.getElementById('status').textContent = 'Erro na autorizacao: ' + error;
  } else {
  document.getElementById('status').textContent = 'Nenhum codigo encontrado na URL.';
  }
</script>
  </body>
  </html>
